name: Build nds-bootstrap-ra

on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    # Unpinned on purpose. devkitpro/devkitarm:20241104 is bullseye, and its apt
    # security pocket 404s, so a pin there never installs. The toolchain version
    # is printed below so drift is visible in the log.
    container: devkitpro/devkitarm:latest
    name: Build RA release with devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        run: |
          # gcc builds lzss, which ra_release.sh needs on PATH. Retried because a
          # mirror briefly out of step with its index is how this workflow used to fail.
          for i in 1 2 3; do
            apt-get update && apt-get install -y --no-install-recommends gcc && break
            echo "apt attempt $i failed; retrying"
            sleep 10
          done
          gcc lzss.c -o /usr/local/bin/lzss

      - name: Which toolchain this ran on
        run: arm-none-eabi-gcc --version | head -1

      - name: Setup environment
        run: git config --global safe.directory '*'

      # tools/ra_release.sh cleans, proves RA_LAUNCHER_WIFI=0 still compiles, then
      # builds the deliverable at RA_LAUNCHER_WIFI=2. It refuses to emit a ROM whose
      # ARM7 has no dsiwifi symbols, and it runs the host suite before it will copy
      # retail/bin/nds-bootstrap.nds. make package-nightly does none of that.
      #
      # The script sends that first make's output to /dev/null, so a compile failure
      # is only "exit code 2". On failure, rebuild visibly so the log has the error.
      - name: Build RA release
        run: |
          bash tools/ra_release.sh nds-bootstrap-release.nds || status=$?
          if [ "${status:-0}" -ne 0 ]; then
            echo "ra_release.sh failed ($status); rebuilding visibly"
            make RA_LAUNCHER_WIFI=0
            exit "$status"
          fi

      - name: Publish ROM
        uses: actions/upload-artifact@v4
        with:
          name: nds-bootstrap-release
          path: nds-bootstrap-release.nds
          if-no-files-found: error

  publish_build:
    runs-on: ubuntu-latest
    name: Attach ROM to the GitHub release
    if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
    needs: build
    steps:
      - name: Download ROM
        uses: actions/download-artifact@v4
        with:
          name: nds-bootstrap-release
          path: build

      - name: Upload to ${{ github.repository }} release
        run: |
          ID=$(jq --raw-output '.release.id' "$GITHUB_EVENT_PATH")
          file="${{ github.workspace }}/build/nds-bootstrap-release.nds"
          curl -XPOST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Length: $(stat -c%s "$file")" \
            -H "Content-Type: application/octet-stream" \
            --upload-file "$file" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$ID/assets?name=nds-bootstrap-release.nds"
