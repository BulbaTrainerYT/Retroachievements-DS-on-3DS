name: Build nds-bootstrap-ra

on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    name: Build RA release with devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        run: |
          for i in 1 2 3; do
            apt-get update && apt-get install -y --no-install-recommends gcc && break
            echo "apt attempt $i failed; retrying"
            sleep 10
          done
          gcc lzss.c -o /usr/local/bin/lzss

      - name: Which toolchain this ran on
        run: arm-none-eabi-gcc --version | head -1

      - name: Setup environment
        run: git config --global safe.directory '*'

      - name: Build RA release
        run: bash tools/ra_release.sh nds-bootstrap-release.nds

      - name: Publish ROM
        uses: actions/upload-artifact@v4
        with:
          name: nds-bootstrap-release
          path: nds-bootstrap-release.nds
          if-no-files-found: error

  publish_build:
    runs-on: ubuntu-latest
    name: Attach ROM to the GitHub release
    if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
    needs: build
    steps:
      - name: Download ROM
        uses: actions/download-artifact@v4
        with:
          name: nds-bootstrap-release
          path: build

      - name: Upload to ${{ github.repository }} release
        run: |
          ID=$(jq --raw-output '.release.id' "$GITHUB_EVENT_PATH")
          file="${{ github.workspace }}/build/nds-bootstrap-release.nds"
          curl -XPOST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Length: $(stat -c%s "$file")" \
            -H "Content-Type: application/octet-stream" \
            --upload-file "$file" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$ID/assets?name=nds-bootstrap-release.nds"
