name: Build nds-bootstrap-ra

on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    # libnds 2.x, which is what :latest carries, removed nds/fifocommon.h. This tree
    # builds against libnds 1.8.0, pinned by devkitpro/devkitarm:20241104. That image
    # is Debian 11, whose security pocket 404s, so apt is pointed at the archive first.
    container: devkitpro/devkitarm:20241104
    name: Build RA release with devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        run: |
          # Bullseye has moved to the archive. The security line names a package version
          # the mirror no longer serves, which is the 404 that made this pin look broken.
          sed -i 's|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g' /etc/apt/sources.list
          sed -i '/debian-security/d' /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99no-check-valid
          # gcc alone does not pull libc6-dev when recommends are off, and lzss.c
          # then fails on stdio.h. libc6-dev is the header package.
          for i in 1 2 3; do
            apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev && break
            echo "apt attempt $i failed; retrying"
            sleep 10
          done
          gcc lzss.c -o /usr/local/bin/lzss

      - name: Which toolchain this ran on
        run: arm-none-eabi-gcc --version | head -1

      - name: Setup environment
        run: git config --global safe.directory '*'

      # ra_release.sh hides the first make's output. On failure, rebuild visibly.
      - name: Build RA release
        run: |
          bash tools/ra_release.sh nds-bootstrap-release.nds || status=$?
          if [ "${status:-0}" -ne 0 ]; then
            echo "ra_release.sh failed ($status); rebuilding visibly"
            make RA_LAUNCHER_WIFI=0
            exit "$status"
          fi

      - name: Publish ROM
        uses: actions/upload-artifact@v4
        with:
          name: nds-bootstrap-release
          path: nds-bootstrap-release.nds
          if-no-files-found: error

  publish_build:
    runs-on: ubuntu-latest
    name: Attach ROM to the GitHub release
    if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
    needs: build
    steps:
      - name: Download ROM
        uses: actions/download-artifact@v4
        with:
          name: nds-bootstrap-release
          path: build

      - name: Upload to ${{ github.repository }} release
        run: |
          ID=$(jq --raw-output '.release.id' "$GITHUB_EVENT_PATH")
          file="${{ github.workspace }}/build/nds-bootstrap-release.nds"
          curl -XPOST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Length: $(stat -c%s "$file")" \
            -H "Content-Type: application/octet-stream" \
            --upload-file "$file" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$ID/assets?name=nds-bootstrap-release.nds"
