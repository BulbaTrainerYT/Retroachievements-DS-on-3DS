name: Build nds-bootstrap-ra

on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    # libnds 2.x removed nds/fifocommon.h. This tree builds against libnds 1.8.0.
    container: devkitpro/devkitarm:20241104
    name: Build RA release with devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        run: |
          sed -i 's|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g' /etc/apt/sources.list
          sed -i '/debian-security/d' /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99no-check-valid
          for i in 1 2 3; do
            apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev && break
            echo "apt attempt $i failed; retrying"
            sleep 10
          done
          gcc lzss.c -o /usr/local/bin/lzss

      - name: Which toolchain this ran on
        run: /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc --version | head -1

      - name: Setup environment
        run: git config --global safe.directory '*'

      # make finds the toolchain through the Makefile. A later shell line does not,
      # so arm-none-eabi-nm was "not found" and the wifi count was 0 even after a
      # successful RA_LAUNCHER_WIFI=2 build. Call nm by absolute path.
      - name: Build RA release
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$PATH"
          make clean
          make RA_LAUNCHER_WIFI=2
          WIFI=$(arm-none-eabi-nm retail/arm7/nds-bootstrap.elf | grep -ci 'dsiwifi\|wifi_' || true)
          echo "wifi symbols: $WIFI"
          if [ "$WIFI" -lt 20 ]; then
            echo "REFUSING: ARM7 has $WIFI wifi symbols, not a network build"
            exit 1
          fi
          cp retail/bin/nds-bootstrap.nds nds-bootstrap-release.nds
          md5sum nds-bootstrap-release.nds

      - name: Publish ROM
        uses: actions/upload-artifact@v4
        with:
          name: nds-bootstrap-release
          path: nds-bootstrap-release.nds
          if-no-files-found: error

  publish_build:
    runs-on: ubuntu-latest
    name: Attach ROM to the GitHub release
    if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
    needs: build
    steps:
      - name: Download ROM
        uses: actions/download-artifact@v4
        with:
          name: nds-bootstrap-release
          path: build

      - name: Upload to ${{ github.repository }} release
        run: |
          ID=$(jq --raw-output '.release.id' "$GITHUB_EVENT_PATH")
          file="${{ github.workspace }}/build/nds-bootstrap-release.nds"
          curl -XPOST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Length: $(stat -c%s "$file")" \
            -H "Content-Type: application/octet-stream" \
            --upload-file "$file" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$ID/assets?name=nds-bootstrap-release.nds"
