name: Build nds-bootstrap-ra

on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned again, and this time the reason the pin could not install its own dependencies is
    # fixed rather than worked around.
    #
    # The history: this was pinned to 20241104 and failed four times on `apt-get` 404ing for
    # linux-libc-dev, so the tag was floated to :latest and the toolchain version printed instead.
    # Floating traded one failure for a worse one. Every run since has died on
    # `nds/fifocommon.h: No such file or directory`, because :latest carries libnds 2.x and this
    # tree needs 1.8.0 -- which README.md says in as many words. Eight runs, eight failures, and
    # the second cause was the one the project had already documented.
    #
    # The 404 is not the pin's fault either. That image is Debian bullseye, Debian 11 has reached
    # end of life, and deb.debian.org no longer serves the package versions the image's own index
    # names. The packages are on archive.debian.org, which is where an EOL release is supposed to
    # be fetched from, so the install step redirects there and asks for nothing that is not
    # already missing.
    #
    # Keeping the project's usual trade as well: the container is still asked what it is, out
    # loud, before anything is built with it.
    container: devkitpro/devkitarm:20241104
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      # Printed unconditionally, and then one hard check. Both failures this workflow has ever had
      # were properties of the container rather than of the code, and a missing header 90 seconds
      # into a build is a worse way to learn that than a named precondition in the first 5.
      - name: What this image is
        run: |
          . /etc/os-release && echo "image:      $PRETTY_NAME"
          # Not on PATH in the 20241104 image, only $DEVKITARM is exported. The makefiles use
          # the variable rather than the PATH, so this line is the only place it matters.
          DKGCC="$(command -v arm-none-eabi-gcc || echo "$DEVKITARM/bin/arm-none-eabi-gcc")"
          echo "devkitARM:  $("$DKGCC" --version | head -1)"
          if [ -f "$DEVKITPRO/libnds/include/nds/fifocommon.h" ]; then
            echo "libnds:     has nds/fifocommon.h, so this is the 1.x line this tree needs"
          else
            echo "::error::This image's libnds has no nds/fifocommon.h. The tree uses it, along with"
            echo "::error::nds/fifomessages.h, nds/arm7/clock.h and sec_t, all of which libnds 2.x"
            echo "::error::removed. Build against libnds 1.8.0 (devkitARM r65, image 20241104) and do"
            echo "::error::not float this container tag. See README.md, Compiling."
            exit 1
          fi
      - name: Install host tools
        run: |
          # Only what is actually missing. gcc builds lzss, which has to run on the host or every
          # .lz77 target fails with Error 127; p7zip-full packs the artifacts.
          need=""
          # Compiled rather than looked up. `command -v gcc` answers yes on an image that has the
          # driver and no libc headers, which is how this step got as far as
          # `lzss.c:20:10: fatal error: stdio.h: No such file or directory` with gcc freshly
          # installed: gcc pulls libgcc-10-dev but not libc6-dev under --no-install-recommends,
          # and libc6-dev is what linux-libc-dev -- the package the original 404 was for -- sits
          # under. So the probe is the thing this step actually needs, which is a hosted compiler
          # that can build lzss.
          echo '#include <stdio.h>'          >  /tmp/cc-probe.c
          echo 'int main(void){return 0;}'   >> /tmp/cc-probe.c
          gcc /tmp/cc-probe.c -o /tmp/cc-probe 2>/dev/null || need="$need gcc libc6-dev"
          command -v 7z >/dev/null 2>&1 || need="$need p7zip-full"
          if [ -z "$need" ]; then
            echo "nothing to install"
          else
            echo "installing:$need"
            # An end-of-life Debian is served by archive.debian.org and by nothing else, and
            # only its release pocket is served at all. Measured rather than assumed:
            # archive.debian.org/debian/dists/bullseye/Release answers 200, while
            # archive.debian.org/debian-security/dists/ holds nothing newer than buster, so
            # bullseye-security 404s on the archive exactly as it does on the live mirror.
            # Redirecting that line only moves the 404, so -security and -updates are dropped
            # instead. What is left is the release pocket, which has gcc and p7zip-full in it:
            # CI needs the packages, not the patches.
            #
            # Check-Valid-Until is off because an archived Release file is expected to be older
            # than apt's freshness window.
            . /etc/os-release
            case "$VERSION_CODENAME" in
              stretch|buster|bullseye)
                for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
                  [ -f "$f" ] || continue
                  sed -i -e 's|://deb.debian.org/debian|://archive.debian.org/debian|g' \
                         -e "/$VERSION_CODENAME-updates/d" \
                         -e "/$VERSION_CODENAME-security/d" \
                         -e '/-security/d' \
                         "$f"
                done
                echo "--- apt sources after the redirect"
                cat /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null | grep -v '^[[:space:]]*#' | grep . || true
                ;;
            esac
            for i in 1 2 3; do
              apt-get -o Acquire::Check-Valid-Until=false update \
                && apt-get install -y --no-install-recommends $need && break
              echo "apt attempt $i failed; retrying"
              sleep 10
            done
          fi
          gcc lzss.c -o /usr/local/bin/lzss
      - name: Setup environment
        run: git config --global safe.directory '*'
      # The reader's chain walker is pure address logic, so it can be checked here
      # rather than by flashing a card. Runs before the build so a logic regression
      # fails in seconds instead of after every cardengine variant has linked.
      - name: Test the RA reader
        run: ./tools/ra_reader_test.sh
      - name: Build nightly
        if: ${{ !startsWith(github.ref, 'refs/tags') }}
        run: make package-nightly
      - name: Build release
        if: ${{ startsWith(github.ref, 'refs/tags') }}
        run: make package-release
      # How much room is left in each cardengine window that carries the reader.
      # The linker scripts already fail the build if it runs out; this is so the
      # margin is visible while it is still a margin, on the pinned toolchain rather
      # than whatever a developer happens to have installed.
      - name: Report cardengine space budget
        run: ./tools/ra_snapshot_addr.sh
      - name: Pack 7z nightly
        if: ${{ !startsWith(github.ref, 'refs/tags') }}
        run: |
          printf "${{ github.sha }}\n" >> bin/nightly-bootstrap.ver
          mv bin/ nds-bootstrap/
          7z a nds-bootstrap.7z nds-bootstrap/

          mkdir -p ~/artifacts
          cp nds-bootstrap.7z ~/artifacts
      - name: Pack 7z release
        if: ${{ startsWith(github.ref, 'refs/tags') }}
        run: |
          printf "Release ${{ github.ref_name }}\n" >> bin/release-bootstrap.ver
          cd bin
          mkdir -p ~/artifacts

          7z a nds-bootstrap.7z .
          cp nds-bootstrap.7z ~/artifacts
          rm nds-bootstrap.7z

          7z a nds-bootstrap.zip .
          cp nds-bootstrap.zip ~/artifacts
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: ~/artifacts/*
          name: build

  # Only run this for non-PR jobs.
  publish_build:
    runs-on: ubuntu-latest
    name: Publish build
    if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: Upload to ${{ github.repository }} release
        run: |
          ID=$(jq --raw-output '.release.id' $GITHUB_EVENT_PATH)

          for file in ${{ github.workspace }}/build/*; do
            AUTH_HEADER="Authorization: token ${{ secrets.GITHUB_TOKEN }}"
            CONTENT_LENGTH="Content-Length: $(stat -c%s $file)"
            CONTENT_TYPE="Content-Type: application/7z-x-compressed"
            UPLOAD_URL="https://uploads.github.com/repos/${{ github.repository }}/releases/$ID/assets?name=$(basename $file)"

            curl -XPOST -H "$AUTH_HEADER" -H "$CONTENT_LENGTH" -H "$CONTENT_TYPE" --upload-file "$file" "$UPLOAD_URL"
          done
